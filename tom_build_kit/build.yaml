# Build configuration for tom_build_kit
#
# This package provides both:
# - A CLI orchestration tool (buildkit)
# - build_runner builders (version, cleanup, compiler)

# Builder definitions
builders:
  version_builder:
    import: "package:tom_build_kit/builder.dart"
    builder_factories: ["versionBuilder"]
    build_extensions: {".dart": [".version.g.dart"]}
    auto_apply: none
    build_to: source

  cleanup_builder:
    import: "package:tom_build_kit/builder.dart"
    builder_factories: ["cleanupBuilder"]
    build_extensions: {".yaml": [".cleanup.stamp"]}
    auto_apply: none
    build_to: source

  compiler_builder:
    import: "package:tom_build_kit/builder.dart"
    builder_factories: ["compilerBuilder"]
    build_extensions: {".dart": [".compile.stamp"]}
    auto_apply: none
    build_to: source

targets:
  $default:
    builders:
      # Version builder - generates version.g.dart with build info
      tom_build_kit|version_builder:
        enabled: true
        options:
          output: lib/src/version.g.dart
          includeGitCommit: true
          variablePrefix: buildkit

      tom_build_kit|compiler_builder:
        enabled: true
        options:
          compiles:
            # macOS ARM64 - compile for self + all Linux targets
            - commandline:
                - mkdir -p $HOME/.tom/bin/${target-platform-vs}
                - dart compile exe ${file} --target-os=${target-os} -o $HOME/.tom/bin/${target-platform-vs}/${file.name}
              files: bin/buildkit.dart
              targets: [darwin-arm64, linux-x64, linux-arm64, linux-armhf]
              platforms: [darwin-arm64]
            
            # Other platforms - compile for self only
            - commandline:
                - mkdir -p $HOME/.tom/bin/${target-platform-vs}
                - dart compile exe ${file} -o $HOME/.tom/bin/${target-platform-vs}/${file.name}
              files: bin/buildkit.dart
              platforms: [darwin-x64, linux-*, win32-*]

          postcompile:
            # Make binaries executable on Unix-like systems
            - commandline:
                - chmod -R +x $HOME/.tom/bin/${current-platform-vs}/
              platforms: [macos, linux]

# Configuration for the runner tool
tom_build_runner:
  build_runner:
    exclude-builders:
      - tom_build_kit|compiler_builder
