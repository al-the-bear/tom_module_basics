# Build configuration for tom_build_kit
#
# This package provides both:
# - A CLI orchestration tool (buildkit) with integrated tools
# - A build_runner builder (version_builder) for version file generation
#
# Note: Compilation and cleanup are handled by their respective CLI tools
# (compiler, cleanup) rather than build_runner builders, because builder
# execution order is not predictable in general.

# Builder definitions
builders:
  version_builder:
    import: "package:tom_build_kit/builder.dart"
    builder_factories: ["versionBuilder"]
    build_extensions: {".dart": [".version.g.dart"]}
    auto_apply: none
    build_to: source

targets:
  $default:
    builders:
      # Version builder - generates version.g.dart with build info
      tom_build_kit:version_builder:
        enabled: true
        options:
          output: lib/src/version.g.dart
          includeGitCommit: true
          variablePrefix: buildkit
