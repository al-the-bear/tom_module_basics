name: tom_build_kit
description: Build orchestration tool with pipelines that integrates Tom build tools.
version: 1.0.0
publish_to: none

environment:
  sdk: ^3.10.4

dependencies:
  args: ^2.7.0
  glob: ^2.1.3
  path: ^1.9.0
  yaml: ^3.1.2
  tom_build_base:
    path: ../tom_build_base
  # Tools that can be used as commands within buildkit
  tom_version_builder:
    path: ../tom_version_builder
  tom_compiler_builder:
    path: ../tom_compiler_builder
  tom_build_runner:
    path: ../tom_build_runner
  tom_d4rt_astgen:
    path: ../tom_d4rt_astgen
  tom_d4rt_generator:
    path: ../../tom_module_d4rt/tom_d4rt_generator

dev_dependencies:
  build_runner: ^2.4.15
  lints: ^6.0.0
  test: ^1.25.6

executables:
  buildkit:
