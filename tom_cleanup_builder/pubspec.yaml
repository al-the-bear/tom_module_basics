name: tom_cleanup_builder
description: Build-time and CLI tool for cleaning up generated and temporary files in Dart projects.
version: 1.0.0
repository: https://github.com/al-the-bear/tom_module_basics
publish_to: none

environment:
  sdk: ^3.10.4

dependencies:
  args: ^2.7.0
  build: ^4.0.4
  glob: ^2.1.3
  path: ^1.9.0
  tom_build_base:
  yaml: ^3.1.2

executables:
  cleanup: cleanup

dev_dependencies:
  build_runner: ^2.4.13
  build_test: ^3.5.5
  lints: ^6.0.0
  test: ^1.25.6
