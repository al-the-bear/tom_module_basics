name: tom_dependencies_tool
description: Dependency tree visualization tool for Dart projects.
version: 1.0.0
repository: https://github.com/al-the-bear/tom_module_basics
publish_to: none

environment:
  sdk: ^3.10.4

dependencies:
  args: ^2.7.0
  glob: ^2.1.3
  path: ^1.9.0
  tom_build_base:
    path: ../tom_build_base
  yaml: ^3.1.2

executables:
  dependencies: dependencies

dev_dependencies:
  build_runner: ^2.4.0
  lints: ^6.0.0
  test: ^1.25.6
  tom_build_kit:
    path: ../tom_build_kit
