name: tom_version_builder
description: Build-time version file generator that reads version from pubspec.yaml and adds build timestamp.
version: 1.0.0
repository: https://github.com/al-the-bear/tom_module_basics
publish_to: none

environment:
  sdk: ^3.10.4

dependencies:
  args: ^2.7.0
  build: ^4.0.4
  glob: ^2.1.3
  path: ^1.9.0
  pub_semver: ^2.2.0
  tom_build_base:
    path: ../tom_build_base
  yaml: ^3.1.2

executables:
  versioner: versioner

dev_dependencies:
  build_runner: ^2.4.13
  build_test: ^3.5.5
  lints: ^6.0.0
  test: ^1.25.6
