# Build configuration for tom_analyzer code analysis
# 
# This build.yaml configures the analyzer to analyze tom_core_server.

targets:
  $default:
    builders:
      tom_analyzer|tom_analyzer:
        enabled: true
        generate_for:
          - lib/main.dart
        options:
          barrels:
            - lib/main.dart
          output_format: yaml
          follow_re_exports: true
