# Build configuration for tom_analyzer code analysis
# 
# This build.yaml configures the analyzer to run during build_runner execution.
# The analyzer processes the entry point and outputs a structured YAML/JSON file
# containing the analysis results.

targets:
  $default:
    builders:
      tom_analyzer|tom_analyzer:
        enabled: true
        generate_for:
          - lib/main.dart
        options:
          # Barrel files to analyze (must match generate_for paths)
          barrels:
            - lib/main.dart
          # Output format: yaml or json
          output_format: yaml
          # Include all exported types from the barrel file
          follow_re_exports: true
